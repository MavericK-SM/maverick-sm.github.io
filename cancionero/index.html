<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Solo la encuentra quien recibe el link: se pide a los buscadores que no la muestren. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Cancionero</title>
  <meta name="description" content="Cancionero — Parroquia Cristo Hijo de Dios">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cancionero">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iconos/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="iconos/icono-180.png">
  <link rel="preload" href="fuentes/inter_regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fuentes/source_serif_semibold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // El tema antes de dibujar, para que no destelle en blanco en modo oscuro.
    try {
      var t = (JSON.parse(localStorage.getItem('cancionero.v1')) || {}).theme || 'system';
      if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.className = 'dark';
    } catch (e) {}
  </script>
</head>
<body>
  <noscript><p style="padding:24px">Para usar el Cancionero, activa JavaScript en tu navegador.</p></noscript>
  <section class="screen" id="home" aria-label="Cancionero"></section>
  <section class="screen" id="mass" aria-label="Misa" hidden></section>
  <section class="screen" id="favorites" aria-label="Favoritos" hidden></section>
  <section class="screen" id="settings" aria-label="Ajustes" hidden></section>
  <section class="screen no-bar" id="licenses" aria-label="Licencias de código abierto" hidden></section>
  <section class="screen" id="reader" aria-label="Lector" hidden></section>
  <nav id="bar" aria-label="Barra inferior"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
